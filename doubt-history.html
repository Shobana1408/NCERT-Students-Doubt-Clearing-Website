<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doubt History — NCERT Doubt Solver</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="css/theme.css" rel="stylesheet" />
  <style>
    .hs-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }
    .history-item {
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }
  </style>
</head>
<body class="nc-page d-flex flex-column">
  <nav class="navbar navbar-expand-lg nc-navbar sticky-top py-2">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand nc-brand d-flex align-items-center gap-2" href="student-dashboard.html">
        <span class="d-flex align-items-center justify-content-center rounded-3 bg-primary bg-opacity-10 text-primary p-2">
          <i class="bi bi-mortarboard-fill fs-5"></i>
        </span>
        <span>NCERT Doubt<span class="text-primary">Solver</span></span>
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#ncNav" aria-controls="ncNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="ncNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item"><a class="nav-link nc-nav-link" href="student-dashboard.html"><i class="bi bi-grid-1x2 me-1"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link nc-nav-link" href="ask-doubt.html"><i class="bi bi-chat-quote me-1"></i> Ask doubt</a></li>
          <li class="nav-item"><a class="nav-link nc-nav-link active" href="doubt-history.html"><i class="bi bi-clock-history me-1"></i> History</a></li>
          <li class="nav-item ms-lg-2 pt-2 pt-lg-0">
            <div class="dropdown">
              <button class="btn btn-nc-ghost dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-4 text-primary"></i>
                <span id="navUserName">Student</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow border-0 nc-card mt-2 py-2">
                <li><a class="dropdown-item rounded-2" href="student-dashboard.html"><i class="bi bi-grid-1x2 me-2"></i> Dashboard</a></li>
                <li><a class="dropdown-item rounded-2" href="ask-doubt.html"><i class="bi bi-chat-quote me-2"></i> Ask doubt</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item rounded-2 text-danger" href="student-login.html" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i> Log out</a></li>
              </ul>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="nc-main flex-grow-1 py-4 py-lg-5">
    <div class="container" style="max-width: 980px;">
      <div class="text-center mb-4">
        <h1 class="fw-bold mb-2">Doubt history</h1>
        <p class="text-muted mb-0">See all your saved frontend-only doubts here.</p>
      </div>

      <div class="hs-card p-4 p-md-5">
        <div id="emptyState" class="text-center py-5 d-none">
          <i class="bi bi-clock-history display-5 text-muted d-block mb-3"></i>
          <h4 class="fw-bold">No doubts yet</h4>
          <p class="text-muted mb-3">Ask your first doubt to see it in history.</p>
          <a href="ask-doubt.html" class="btn btn-nc-primary">Ask a doubt</a>
        </div>

        <div id="historyContainer"></div>
      </div>
    </div>
  </main>

  <footer class="nc-footer py-3 mt-auto">
    <div class="container text-center text-md-start">
      <span class="text-muted small">NCERT Doubt Solver · History</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>

  <script>
    function getLoggedInUser() {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (!user || !user.email) {
        window.location.href = "student-login.html";
        return null;
      }
      return user;
    }

    function getHistoryKey() {
      const user = getLoggedInUser();
      return `doubtHistory_${user.email}`;
    }

    function loadHistory() {
      const key = getHistoryKey();
      return JSON.parse(localStorage.getItem(key)) || [];
    }

    function renderHistory() {
      const historyContainer = document.getElementById("historyContainer");
      const emptyState = document.getElementById("emptyState");
      const history = loadHistory();

      historyContainer.innerHTML = "";

      if (history.length === 0) {
        emptyState.classList.remove("d-none");
        return;
      }

      emptyState.classList.add("d-none");

      history.forEach(function (item, index) {
        const card = document.createElement("div");
        card.className = "history-item shadow-sm p-4 mb-3";

        card.innerHTML = `
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h5 class="fw-bold mb-0">Doubt ${history.length - index}</h5>
            <small class="text-muted">${item.date || ""}</small>
          </div>
          <p class="mb-2"><strong>Subject:</strong> ${item.subject || "-"}</p>
          <p class="mb-2"><strong>Chapter:</strong> ${item.chapter || "-"}</p>
          <p class="mb-2"><strong>Question:</strong> ${item.question || "-"}</p>
          <p class="mb-2"><strong>Answer:</strong> ${item.answer || "-"}</p>
          <p class="mb-2"><strong>Simple Explanation:</strong> ${item.simpleExplanation || "-"}</p>
          <p class="mb-0"><strong>Translated Response:</strong> ${item.translatedResponse || "-"}</p>
        `;

        historyContainer.appendChild(card);
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const user = getLoggedInUser();
      if (!user) return;

      const navUserName = document.getElementById("navUserName");
      const logoutBtn = document.getElementById("logoutBtn");

      if (navUserName) {
        navUserName.textContent = user.name || "Student";
      }

      if (logoutBtn) {
        logoutBtn.addEventListener("click", function () {
          localStorage.removeItem("loggedInUser");
          localStorage.removeItem("doubtData");
        });
      }

      renderHistory();
    });
  </script>
</body>
</html>
